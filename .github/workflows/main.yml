name: build

on: [push, pull_request]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      matrix:
        # go-version: ['oldstable', 'stable']
        go-version: ['stable']
        haxe-version: [latest]
        os: [ubuntu-latest, macos-latest, windows-latest, ubuntu-24.04-arm]
    steps:
      # setup repo
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      # setup go
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
      # setup haxe
      - uses: krdlab/setup-haxe@v2.1.0
        with:
          haxe-version: ${{ matrix.haxe-version }}
      - name: Haxe version
        run: haxe --version
      # cache restores
      - uses: actions/cache/restore@v4
        id: bootstrap-cache-restore
        with:
          path: |
            output/bootstrap
          key: ${{ github.ref_name }}-os-${{ matrix.os }}-build-${{ env.cache-name }}
      - uses: actions/cache/restore@v4
        id: regression-cache-restore
        with:
          path: |
            haxe/tests/unit/bin/go/main/unittests.txt
          key: ${{ github.ref_name }}-os-${{ matrix.os }}-build-${{ env.cache-name }}
      # haxelib setup
      - name: Setup hx2go dev
        run: haxelib dev hx2go .
      - name: Install utest
        run: haxelib git utest https://github.com/haxe-utest/utest
      - name: Run bootstrap
        run: haxe Bootstrap.hxml
      - name: Run isolated test
        run: cd tests/isolated && haxe build.hxml
      - name: Run testbed
        run: haxe Testbed.hxml
      - name: Run tests baseline
        run: haxe Tests-each.hxml --interp
      - name: Run tests
        run: haxe Tests.hxml
      - name: Extern tests
        run: cd hx2go-extern && haxe Testbed.hxml
      - uses: actions/checkout@v4
        with:
          repository: pxshadow/haxe
          ref: go-target
          path: haxe
      - name: Run haxe unit tests
        run: haxe scripts/haxeunit.hxml
      # cache saves
      - name: cache save
        id: bootstrap-cache-save
        uses: actions/cache/save@v4
        env:
          cache-name: bootstrap-cache
        if: always()
        with:
          path: |
            output/bootstrap
          key: ${{ github.ref_name }}-${{ matrix.os }}-build-${{ env.cache-name }}
      - name: cache save
        id: regression-cache-save
        uses: actions/cache/save@v4
        env:
          cache-name: regression-cache
        if: always()
        with:
          path: |
            haxe/tests/unit/bin/go/main/unittests.txt
          key: ${{ github.ref_name }}-${{ matrix.os }}-build-${{ env.cache-name }}