<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto" style="background:#0f1115">
  <style>
    .title { fill:#e6e6e6; font-size:20px; font-weight:600 }
    .sub   { fill:#9aa0a6; font-size:12px }
    .axis  { stroke:#2a2f3a; stroke-width:1 }
    .tick  { fill:#9aa0a6; font-size:11px }
    .label { fill:#e6e6e6; font-size:12px }
    .delta { fill:#4ade80; font-size:12px; font-weight:600 }
    .before{ fill:#f87171 }
    .after { fill:#4ade80 }
    .legendText { fill:#e6e6e6; font-size:12px }
    .groupLabel{ fill:#e6e6e6; font-size:13px; font-weight:600; text-anchor:middle }
    .unit { fill:#9aa0a6; font-size:11px; text-anchor:middle }
  </style>

  <text x="30" y="34" class="title">ExprWriter.stampLines simplification — before vs after</text>
  <text x="30" y="54" class="sub">haxe Tests.hxml, -D go-profile · 651/651 passing · each metric normalized so "before" = 100%</text>

  <!-- legend -->
  <g transform="translate(720,40)">
    <rect x="0"  y="0" width="12" height="12" class="before"/>
    <text x="18" y="10" class="legendText">before</text>
    <rect x="80" y="0" width="12" height="12" class="after"/>
    <text x="98" y="10" class="legendText">after</text>
  </g>

  <!-- plot area -->
  <g transform="translate(60,110)">
    <!-- y-axis + grid at 0,25,50,75,100 -->
    <line x1="0" y1="0" x2="0" y2="340" class="axis"/>
    <line x1="0" y1="340" x2="880" y2="340" class="axis"/>

    <g>
      <!-- 100% -->
      <line x1="0" y1="0"   x2="880" y2="0"   class="axis" stroke-dasharray="2,4"/>
      <text x="-8" y="4"   class="tick" text-anchor="end">100%</text>
      <!-- 75% -->
      <line x1="0" y1="85"  x2="880" y2="85"  class="axis" stroke-dasharray="2,4"/>
      <text x="-8" y="89"  class="tick" text-anchor="end">75%</text>
      <!-- 50% -->
      <line x1="0" y1="170" x2="880" y2="170" class="axis" stroke-dasharray="2,4"/>
      <text x="-8" y="174" class="tick" text-anchor="end">50%</text>
      <!-- 25% -->
      <line x1="0" y1="255" x2="880" y2="255" class="axis" stroke-dasharray="2,4"/>
      <text x="-8" y="259" class="tick" text-anchor="end">25%</text>
      <!-- 0% -->
      <text x="-8" y="344" class="tick" text-anchor="end">0%</text>
    </g>

    <!-- Groups: 5 metrics -->
    <!-- Metric 0: Wall time (2.05s -> 0.73s = 35.6%) -->
    <!-- Metric 1: Total CPU samples (5.95s -> 1.56s = 26.2%) -->
    <!-- Metric 2: Total alloc_space (2117MB -> 483MB = 22.8%) -->
    <!-- Metric 3: stampLines alloc_space (815MB -> ~0MB = 0%) -->
    <!-- Metric 4: HxString.substr alloc (371MB -> 18.5MB = 5.0%) -->
    <!-- bar: 340 = 100%; w = pct * 3.4 -->

    <!-- helper: group width 160, bars 55 wide, gap 10 -->

    <!-- G0 Wall time -->
    <g transform="translate(40,0)">
      <rect x="0"  y="0"   width="55" height="340" class="before"/>
      <rect x="65" y="219.0" width="55" height="121.0" class="after"/>
      <text x="27"  y="-6"  class="label" text-anchor="middle">2.05 s</text>
      <text x="92"  y="214" class="delta" text-anchor="middle">0.73 s</text>
      <text x="60"  y="360" class="groupLabel">Wall time</text>
      <text x="60"  y="376" class="unit">−64% (2.8× faster)</text>
    </g>

    <!-- G1 CPU samples -->
    <g transform="translate(220,0)">
      <rect x="0"  y="0"   width="55" height="340" class="before"/>
      <rect x="65" y="250.9" width="55" height="89.1" class="after"/>
      <text x="27"  y="-6"  class="label" text-anchor="middle">5.95 s</text>
      <text x="92"  y="246" class="delta" text-anchor="middle">1.56 s</text>
      <text x="60"  y="360" class="groupLabel">CPU samples</text>
      <text x="60"  y="376" class="unit">−74%</text>
    </g>

    <!-- G2 total alloc -->
    <g transform="translate(400,0)">
      <rect x="0"  y="0"   width="55" height="340" class="before"/>
      <rect x="65" y="262.5" width="55" height="77.5" class="after"/>
      <text x="27"  y="-6"  class="label" text-anchor="middle">2117 MB</text>
      <text x="92"  y="258" class="delta" text-anchor="middle">483 MB</text>
      <text x="60"  y="360" class="groupLabel">Total alloc_space</text>
      <text x="60"  y="376" class="unit">−77% (4.4× less)</text>
    </g>

    <!-- G3 stampLines alloc -->
    <g transform="translate(580,0)">
      <rect x="0"  y="0"   width="55" height="340" class="before"/>
      <rect x="65" y="337" width="55" height="3" class="after"/>
      <text x="27"  y="-6"  class="label" text-anchor="middle">815 MB</text>
      <text x="92"  y="332" class="delta" text-anchor="middle">≈ 0</text>
      <text x="60"  y="360" class="groupLabel">stampLines alloc</text>
      <text x="60"  y="376" class="unit">dropped out of top-20</text>
    </g>

    <!-- G4 HxString.substr -->
    <g transform="translate(760,0)">
      <rect x="0"  y="0"   width="55" height="340" class="before"/>
      <rect x="65" y="323.0" width="55" height="17.0" class="after"/>
      <text x="27"  y="-6"  class="label" text-anchor="middle">371 MB</text>
      <text x="92"  y="318" class="delta" text-anchor="middle">18.5 MB</text>
      <text x="60"  y="360" class="groupLabel">HxString.substr alloc</text>
      <text x="60"  y="376" class="unit">−95%</text>
    </g>
  </g>

  <text x="30" y="540" class="sub">source: cpu.pprof + mem.pprof, go tool pprof -top on hx2go bootstrap main.exe (go-profile) before/after swapping ltrim+substr for a single-pass scan + indexOf.</text>
</svg>
